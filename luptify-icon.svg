<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16192B" />
      <stop offset="100%" stop-color="#090A10" />
    </linearGradient>

    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <linearGradient id="corePlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF7B00" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#iconBg)" stroke="url(#loopGrad)" stroke-width="8" stroke-opacity="0.7" />

  <!-- Subtle Vinyl / Sonic Groove Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.05" stroke-dasharray="14 18" />

  <!-- Main "LUP" Loop + Headphone + 'L' Frame -->
  <path d="M 386 200 
           A 130 130 0 0 0 126 200 
           V 320 
           Q 126 385 191 385 
           H 346" 
        fill="none" 
        stroke="url(#loopGrad)" 
        stroke-width="40" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Equalizer Bars -->
  <line x1="386" y1="252" x2="386" y2="332" stroke="#00F5D4" stroke-width="30" stroke-linecap="round" filter="url(#glow)" />
  <line x1="436" y1="216" x2="436" y2="296" stroke="#FF2A85" stroke-width="24" stroke-linecap="round" />
  <line x1="76" y1="230" x2="76" y2="300" stroke="#00F5D4" stroke-width="24" stroke-linecap="round" />

  <!-- Center Play Button -->
  <path d="M 212 175 
           C 212 155, 232 145, 249 155 
           L 344 215 
           C 361 225, 361 245, 344 255 
           L 249 315 
           C 232 325, 212 315, 212 295 Z" 
        fill="url(#corePlay)" 
        filter="url(#glow)" />

  <!-- Audio Core Node -->
  <circle cx="252" cy="235" r="13" fill="#FFFFFF" />
</svg>
