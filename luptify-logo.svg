<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C14" />
      <stop offset="50%" stop-color="#121424" />
      <stop offset="100%" stop-color="#08090F" />
    </linearGradient>

    <!-- Icon Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D30" />
      <stop offset="100%" stop-color="#0D0F1A" />
    </linearGradient>

    <!-- Primary Neon Sonic Gradient (Cyan -> Electric Violet -> Hot Magenta) -->
    <linearGradient id="sonicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Play Button & Accent Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="100%" stop-color="#FF7B00" />
    </linearGradient>

    <!-- Wordmark Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="55%" stop-color="#9D4EDD" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Soft Neon Glow Filter -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="800" height="260" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="796" height="256" rx="26" fill="none" stroke="url(#sonicGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Subtle Background Ambient Soundwave Grid -->
  <circle cx="140" cy="130" r="115" fill="none" stroke="#00F5D4" stroke-width="1" stroke-opacity="0.06" />
  <circle cx="140" cy="130" r="135" fill="none" stroke="#FF2A85" stroke-width="1" stroke-opacity="0.04" />

  <!-- ================= ICON EMBLEM ================= -->
  <g transform="translate(0, 0)">
    <!-- Squircle App Badge -->
    <rect x="44" y="34" width="192" height="192" rx="48" fill="url(#badgeGrad)" stroke="url(#sonicGrad)" stroke-width="2.5" stroke-opacity="0.6" />

    <!-- Inner Ambient Ring -->
    <circle cx="140" cy="130" r="68" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.05" stroke-dasharray="6 8" />

    <!-- The "LUP" Loop + Headphone Arch + Capital 'L' -->
    <path d="M 192 108 
             A 52 52 0 0 0 88 108 
             V 156 
             Q 88 182 114 182 
             H 176" 
          fill="none" 
          stroke="url(#sonicGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" />

    <!-- Equalizer Pulse Bars (Right Sonic Emission) -->
    <line x1="192" y1="128" x2="192" y2="160" stroke="#00F5D4" stroke-width="12" stroke-linecap="round" filter="url(#neonGlow)" />
    <line x1="212" y1="114" x2="212" y2="146" stroke="#FF2A85" stroke-width="10" stroke-linecap="round" />
    <line x1="68" y1="120" x2="68" y2="148" stroke="#00F5D4" stroke-width="10" stroke-linecap="round" />

    <!-- Central Play Triangle -->
    <path d="M 122 98 
             C 122 90, 130 86, 137 90 
             L 175 114 
             C 182 118, 182 126, 175 130 
             L 137 154 
             C 130 158, 122 154, 122 146 Z" 
          fill="url(#playGrad)" 
          filter="url(#neonGlow)" />

    <!-- Inner Play Cutout Accent (Audio Node) -->
    <circle cx="138" cy="122" r="5" fill="#FFFFFF" />
  </g>

  <!-- ================= CUSTOM VECTOR WORDMARK: LUPTIFY ================= -->
  <g filter="url(#neonGlow)">
    <!-- "LUP" in Crisp Pure White -->
    <g fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <!-- L -->
      <path d="M 278 82 V 148 H 318" />
      <!-- U -->
      <path d="M 344 82 V 126 A 22 22 0 0 0 388 126 V 82" />
      <!-- P -->
      <path d="M 418 148 V 82 H 442 A 17 17 0 0 1 442 116 H 418" />
    </g>

    <!-- "TIFY" in Neon Sonic Gradient -->
    <g fill="none" stroke="url(#textGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <!-- T -->
      <path d="M 484 82 H 530 M 507 82 V 148" />
      <!-- I (Stylized as an Equalizer Peak Bar) -->
      <path d="M 558 106 V 148" />
      <!-- F -->
      <path d="M 588 148 V 82 H 628 M 588 115 H 618" />
      <!-- Y -->
      <path d="M 650 82 L 673 115 L 696 82 M 673 115 V 148" />
    </g>

    <!-- Glowing Cyan Equalizer Peak Dot on the 'I' -->
    <circle cx="558" cy="82" r="8" fill="#00F5D4" />
  </g>

  <!-- ================= SUBTITLE & SOUNDWAVE ACCENT ================= -->
  <!-- Mini Equalizer Divider -->
  <g stroke="url(#textGrad)" stroke-width="3.5" stroke-linecap="round">
    <line x1="278" y1="184" x2="278" y2="192" />
    <line x1="288" y1="178" x2="288" y2="198" />
    <line x1="298" y1="182" x2="298" y2="194" />
    <line x1="308" y1="175" x2="308" y2="201" />
    <line x1="318" y1="184" x2="318" y2="192" />
    <line x1="328" y1="187" x2="355" y2="187" stroke-opacity="0.4" />
  </g>

  <!-- Tagline Text -->
  <text x="370" y="192" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="13" 
        font-weight="700" 
        letter-spacing="7.5" 
        fill="#A0A8C8">
    AUDIO PLAYER
  </text>
</svg>
